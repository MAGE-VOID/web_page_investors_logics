<svg xmlns="http://www.w3.org/2000/svg" class="canvas figure" data-motion="paused" viewBox="0 0 1200 480"
        width="1200" height="480" role="img" aria-labelledby="hero-titleId hero-descriptionId">
        <title id="hero-titleId">Investors Logics — a study in motion</title>
        <desc id="hero-descriptionId">A folded satin-metal ribbon surrounds the Investors Logics two-candle emblem. Sculpted edges, a recessed layer and a slow reflection give the abstract form depth. The emblem stays still. This is brand artwork, not a physical product or trading data.</desc>
<style>.figure {
  --sculpture-cycle: 12s;
  position: relative;
  isolation: isolate;
  width: 100%;
  margin: 0;
  overflow: hidden;
}

.canvas {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.canvas path, .canvas use { stroke-linecap: round; stroke-linejoin: round; }
.lowerRibbon { animation: layer-breath var(--sculpture-cycle) ease-in-out infinite; }
.lowerEdge { fill: none; stroke: #64869d; stroke-width: .8; opacity: .6; }
.foldSeam { fill: none; stroke: #d8e7eb; stroke-width: .8; opacity: .23; }
.satinCut { fill: none; stroke: #ecf1ed; stroke-width: .75; opacity: .3; }
.frontCut { fill: none; stroke: #e0edf1; stroke-width: .8; opacity: .45; }
.innerLip { fill: none; stroke: #edf2ec; stroke-width: 1; opacity: .7; }
.innerShadow { fill: none; stroke: #09131d; stroke-width: 1; opacity: .75; }
.markCut { fill: none; stroke: #fff8eb; stroke-width: .6; opacity: .65; }

.ribbonReflection {
  opacity: 0;
  animation: satin-reflection var(--sculpture-cycle) cubic-bezier(.4, 0, .2, 1) infinite;
}

.markReflection {
  opacity: 0;
  animation: emblem-reflection var(--sculpture-cycle) cubic-bezier(.4, 0, .2, 1) infinite;
}

.edgeLight {
  fill: none;
  stroke: #e9f4f5;
  stroke-width: 2;
  stroke-dasharray: 7 93;
  stroke-dashoffset: 7;
  opacity: 0;
  animation: perimeter-light var(--sculpture-cycle) linear infinite;
}

.figure[data-motion="paused"] .canvas * { animation-play-state: paused; }

/* One long material study: edge travel, surface reflection, then a quiet hold. */
@keyframes perimeter-light {
  0% { stroke-dashoffset: 7; opacity: 0; }
  6% { opacity: .75; }
  69% { opacity: .75; }
  78%, 100% { stroke-dashoffset: -100; opacity: 0; }
}

@keyframes satin-reflection {
  0%, 8% { transform: translateX(-240px); opacity: 0; }
  16% { opacity: .65; }
  48% { opacity: .65; }
  62%, 100% { transform: translateX(610px); opacity: 0; }
}

@keyframes emblem-reflection {
  0%, 26% { transform: translateX(0); opacity: 0; }
  32% { opacity: .7; }
  46% { opacity: .7; }
  54%, 100% { transform: translateX(225px); opacity: 0; }
}

@keyframes layer-breath {
  0%, 100% { transform: translateY(0); }
  44%, 58% { transform: translateY(5px); }
}

/* Trim empty canvas, not the sculpture or emblem. */
@media (max-width: 47.5rem) {
  .figure { aspect-ratio: 780 / 480; }
  .canvas {
    position: absolute;
    width: 153.846154%;
    max-width: none;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .canvas * { animation: none !important; }
  .ribbonReflection, .markReflection, .edgeLight { opacity: 0; }
}
</style>
<rect width="1200" height="480" fill="#101923"/>
